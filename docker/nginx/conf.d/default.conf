# The Go API is only reachable through this proxy: its container publishes
# no port. It has no CORS, so the PWA calls it same-origin under /api.
upstream api {
    server api:3000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    limit_conn perip 30;

    include /etc/nginx/conf.d/security-headers.inc;

    # Container healthcheck only.
    location = /nginx-health {
        allow 127.0.0.1;
        deny all;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API ---------------------------------------------------------------

    # Login and register: strict rate limit against credential stuffing.
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_except POST { deny all; }
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/conf.d/api-proxy.inc;
    }

    location = /api {
        return 404;
    }

    # ---- PWA ---------------------------------------------------------------

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        limit_except GET { deny all; }
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker, its runtime and the manifest must be revalidated on
    # every load, or a deploy would never reach installed apps.
    location ~ ^/(sw\.js|workbox-[\w-]+\.js|manifest\.webmanifest)$ {
        limit_except GET { deny all; }
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /icons/ {
        limit_except GET { deny all; }
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The MSW worker is dev-only and not shipped; don't answer with the SPA.
    location = /mockServiceWorker.js {
        return 404;
    }

    # Never expose dotfiles (.git, .env…), except ACME challenges.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }

    # SPA: unknown paths fall back to index.html for the Vue router.
    location / {
        limit_except GET { deny all; }
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
